spring:
  application:
    name: lending-desk
  config:
    # Local settings from the repository root .env file (KEY=value lines), if present.
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lending}
    username: ${DB_USER:lending}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate

lending:
  seed:
    enabled: true
