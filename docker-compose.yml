services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lending
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d lending"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
